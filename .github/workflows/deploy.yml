name: Build & Validate Wellfitness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──── Backend: Smoke Test ────────────────────────
  smoke-test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('backend/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Run Smoke Tests
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew test --tests "com.wellfitness.SmokeTest" \
          --no-daemon \
          -Dspring.profiles.active=test

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke-results
          path: backend/build/reports/tests/test/

  # ──── Frontend: Smoke Test ───────────────────────
  smoke-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run Smoke Tests
        run: cd frontend && npm test

  # ──── Backend: Build ─────────────────────────────
  build-backend:
    needs: [smoke-test-backend] # ← only builds if tests pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('backend/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Build Backend
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew build -x test --no-daemon

      - name: Build Docker Image
        run: docker build -t wellfitness-api:${{ github.sha }} ./backend

  # ──── Frontend: Build ────────────────────────────
  build-frontend:
    needs: [smoke-test-frontend] # ← only builds if tests pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build Frontend
        run: cd frontend && npm run build
        env:
          VITE_API_URL: https://api.wellfitness.in/api
