name: Build & Validate Wellfitness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──── Backend: Build & Test ────
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Create a minimal application.properties for CI build
      - name: Create CI config
        run: |
          cat > backend/src/main/resources/application.properties << 'EOF'
          server.port=8080
          spring.datasource.url=jdbc:mysql://localhost:3306/test_db
          spring.datasource.username=root
          spring.datasource.password=test
          spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
          spring.jpa.hibernate.ddl-auto=none
          app.jwt.secret=ci_test_secret_key_64_chars_long_enough_for_jwt_validation_here!!
          app.jwt.expiration-ms=2592000000
          app.google.client-id=test-client-id
          spring.mail.host=smtp.gmail.com
          spring.mail.port=587
          spring.mail.username=test@gmail.com
          spring.mail.password=test
          spring.mail.properties.mail.smtp.auth=true
          spring.mail.properties.mail.smtp.starttls.enable=true
          EOF

      - name: Build Backend
        run: cd backend && chmod +x gradlew && ./gradlew build -x test --no-daemon

      - name: Build Docker Image
        run: docker build -t wellfitness-api:${{ github.sha }} ./backend

  # ──── Frontend: Build & Validate ────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build Frontend
        run: cd frontend && npm run build
        env:
          VITE_API_URL: https://api.wellfitness.in/api
