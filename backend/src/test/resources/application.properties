# ?? Database (H2 in-memory) ??
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# ?? JPA ??
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ?? JWT ??
app.jwt.secret=test_secret_key_64_chars_long_enough_for_jwt_validation_here!!
app.jwt.expiration-ms=2592000000

# ?? Google OAuth ??
app.google.client-id=test-client-id

# ?? Firebase ??
app.firebase.service-account=classpath:firebase-service-account-test.json

# ?? Mail (fake) ??
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ?? Resend / Email ??
RESEND_API_KEY=test-key
APP_EMAIL_FROM=test@test.com