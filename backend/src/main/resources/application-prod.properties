#PROD Profile ( Production)
#  ✅ Safe to commit — ALL secrets come from env vars


server.port=${PORT:8080}

# ──── MySQL (Railway provides these) ────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ──── JWT ────
app.jwt.secret=${JWT_SECRET}

# ──── Google OAuth ────
app.google.client-id=${GOOGLE_CLIENT_ID:not-set}

# ──── Gmail SMTP ────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# ──── Firebase ────
app.firebase.service-account=${FIREBASE_SA_PATH:classpath:firebase-service-account.json}

# ──── CORS ────
app.cors.allowed-origins=https://wellfitness-ten.vercel.app


resend.api.key=${RESEND_API_KEY}
app.email.from=${APP_EMAIL_FROM}
