# ════════════════════════════════════════════════════
#  Wellfitness — Common Configuration (all profiles)
# ════════════════════════════════════════════════════

# Default profile is "dev" (for local development)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ──── JPA / Hibernate (shared) ────
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# ──── File Upload (shared) ────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ──── OTP (shared) ────
app.otp.expiry-minutes=5

# ──── JWT expiry (shared) ────
app.jwt.expiration-ms=2592000000

# ──── SMTP settings (shared, credentials per-profile) ────
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
