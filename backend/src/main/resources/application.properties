# ──── Server ────
server.port=${PORT:8080}

# ──── MySQL ────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wellfitness_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ──── JPA / Hibernate ────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# ──── JWT ────
app.jwt.secret=${JWT_SECRET:Wellfitness_Super_Secret_Key_2025_Change_In_Production_MinLength64Chars!!}
app.jwt.expiration-ms=2592000000

# ──── File Upload ────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ──── Google OAuth ────
app.google.client-id=${GOOGLE_CLIENT_ID:}

# ──── OTP ────
app.otp.expiry-minutes=5

# ──── Gmail SMTP (for email verification) ────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ──── Firebase ────
app.firebase.service-account=${FIREBASE_SA_PATH:classpath:firebase-service-account.json}
