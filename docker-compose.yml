version: '3.8'

services:
  # ──── MySQL Database ────
  db:
    image: mysql:8
    container_name: wellfitness-db
    environment:
      MYSQL_ROOT_PASSWORD: 159Atg45@
      MYSQL_DATABASE: wellfitness_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──── Spring Boot Backend ────
  backend:
    build: ./backend
    container_name: wellfitness-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/wellfitness_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASS: 159Atg45@
      JWT_SECRET: docker_dev_secret_change_in_production_min64chars_long_enough!!
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
