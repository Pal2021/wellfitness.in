services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: 159Atg45@
      MYSQL_DATABASE: wellfitness_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://db:3306/wellfitness_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      APP_EMAIL_FROM: ${APP_EMAIL_FROM:-}
      GOOGLE_CLIENT_ID: &google-client-id ${GOOGLE_CLIENT_ID:-473083426303-lo1u95qd7ptter1pshqe3eaqqutbqgkl.apps.googleusercontent.com}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      DB_USER: root
      DB_PASS: 159Atg45@
      JWT_SECRET: Wellfitness_Super_Secret_Key_2025_Change_In_Production_MinLength64Chars!!
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: *google-client-id
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
